# Fixed replicas unless autoscaling.enabled (then the HPA owns the count). See docs/HELM.md#autoscaling
replicaCount: 2
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Zero-downtime rollouts. See docs/HELM.md#zero-downtime
rollout:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
pdb:
  enabled: true
  minAvailable: 1
antiAffinity:
  enabled: true
# Stop sequence: preStop sleep (endpoints removed), then SIGTERM drain (app: 20s), within the grace period.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# Prefer arm64 nodes, fall back to any (README L57). See docs/HELM.md#scheduling
preferredArch: arm64

# See docs/HELM.md#resources
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

# Only the Envoy proxy may reach the app (README L58). See docs/HELM.md#network-policy
networkPolicy:
  enabled: true

image:
  repository: ghcr.io/yoyobesser/echo-pong
  tag: ""
  pullPolicy: IfNotPresent
# Registry credentials if the GHCR package is private (README L59). See docs/HELM.md#image-pull
imagePullSecrets: []

# Existing Secret with key `token`, mounted as the app's secret file. See docs/HELM.md#auth-secret
auth:
  existingSecret: echo-pong-auth

# Non-root, no escalation, no caps, read-only root FS. See docs/HELM.md#security-context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  port: 80

gateway:
  className: echo-pong
  serviceType: ClusterIP
  serviceAnnotations: {}
  port: 80
  hostnames: []

envoy-gateway:
  enabled: true
