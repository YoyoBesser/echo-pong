replicaCount: 2

# Zero-downtime rollouts. See docs/HELM.md#zero-downtime
rollout:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
pdb:
  enabled: true
  minAvailable: 1
antiAffinity:
  enabled: true

# Prefer arm64 nodes, fall back to any (README L57). See docs/HELM.md#scheduling
preferredArch: arm64

# See docs/HELM.md#resources
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

# Only the Envoy proxy may reach the app (README L58). See docs/HELM.md#network-policy
networkPolicy:
  enabled: true

image:
  repository: ghcr.io/yoyobesser/echo-pong
  tag: ""
  pullPolicy: IfNotPresent

# Existing Secret with key `token`, mounted as the app's secret file. See docs/HELM.md#auth-secret
auth:
  existingSecret: echo-pong-auth

# Non-root, no escalation, no caps, read-only root FS. See docs/HELM.md#security-context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  port: 80

gateway:
  className: echo-pong
  serviceType: ClusterIP
  port: 80
  hostnames: []

envoy-gateway:
  enabled: true
