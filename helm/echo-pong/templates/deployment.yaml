apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "echo-pong.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.rollout.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "echo-pong.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "echo-pong.selectorLabels" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.antiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "echo-pong.selectorLabels" . | nindent 20 }}
      {{- end }}
      containers:
        - name: echo-pong
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SECRET_FILE_PATH
              value: /var/run/secrets/echo-pong/token
          ports:
            - name: http
              containerPort: 8080
          # App sleeps 10s before listening. See docs/HELM.md#probes
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: auth
              mountPath: /var/run/secrets/echo-pong
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
