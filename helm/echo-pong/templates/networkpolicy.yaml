{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "echo-pong.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "echo-pong.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: {{ .Release.Name }}
              gateway.envoyproxy.io/owning-gateway-namespace: {{ .Release.Namespace }}
      ports:
        - port: http
{{- end }}
