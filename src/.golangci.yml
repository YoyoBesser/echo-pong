version: "2"

run:
  build-tags: [e2e]

# Correctness, hygiene and SAST (gosec) in one run; go vet still runs too. See docs/CI.md#go-lint
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - gosec
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - bodyclose
    - misspell

formatters:
  enable:
    - gofmt
