# Python tooling for .github/ scripts; uv-managed, Python from .python-version. See docs/CI.md#common-ci
[project]
name = "echo-pong-ci"
version = "0.0.0"
requires-python = ">=3.14"  # .python-version 3.14 = newest cached on ubuntu-24.04 runner (3.14.8), actions/runner-images Ubuntu2404-Readme.md (checked 2026-10-21)

[dependency-groups]
dev = [
    "pytest==9.1.1",      # latest: https://pypi.org/project/pytest/ (checked 2026-10-21)
    "pytest-cov==7.1.0",  # latest: https://pypi.org/project/pytest-cov/ (checked 2026-10-21)
    "ruff==0.17.1",       # latest: https://pypi.org/project/ruff/ (checked 2026-10-21)
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=100"
pythonpath = ["actions/summarize-results", "scripts"]
testpaths = ["actions", "scripts"]

[tool.coverage.run]
source = ["actions", "scripts"]
