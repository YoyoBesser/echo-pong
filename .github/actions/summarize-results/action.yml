name: Summarize results
description: Render all recorded check outcomes as Tests and Security tables in the run summary. See .github/workflows/AGENTS.md.

inputs:
  order:
    description: Space-separated job ids, in the order their checks should be listed.
    required: true

runs:
  using: composite
  steps:
    # No results (or act) must not fail the summary.
    - uses: actions/download-artifact@v8  # latest: https://github.com/actions/download-artifact/releases (checked 2026-10-21)
      continue-on-error: true
      with:
        pattern: ci-results-*
        path: ${{ runner.temp }}/ci-results
        merge-multiple: true
    # uv + Python from .github/.python-version, same as common-ci. See docs/CI.md#common-ci
    - uses: ./.github/actions/install-ci-tools
      with:
        suite: github
    - shell: bash
      env:
        ORDER: ${{ inputs.order }}
        RESULTS: ${{ runner.temp }}/ci-results
      run: 'uv run --locked --project .github python "$GITHUB_ACTION_PATH/render.py" "$RESULTS" $ORDER >> "$GITHUB_STEP_SUMMARY"'
