name: Gather metadata
description: Resolve branch, commit and trigger reason for the current run and expose them as outputs. Requires a prior actions/checkout.

inputs:
  image:
    description: Image name override (e.g. localhost:5000/echo-pong under act). Default ghcr.io/<owner>/<repo>.
    default: ""

outputs:
  branch:
    description: Branch the run is for (PR head branch on pull requests; empty on tag pushes).
    value: ${{ steps.meta.outputs.branch }}
  sha:
    description: Full commit SHA being built (PR head commit on pull requests).
    value: ${{ steps.meta.outputs.sha }}
  short-sha:
    description: First 7 characters of the commit SHA.
    value: ${{ steps.meta.outputs.short-sha }}
  commit-message:
    description: Subject line of the commit being built.
    value: ${{ steps.meta.outputs.commit-message }}
  reason:
    description: Event that triggered the run (push, pull_request, workflow_dispatch, ...).
    value: ${{ steps.meta.outputs.reason }}
  branch-slug:
    description: Branch as a valid image tag (lowercase, [a-z0-9._-]); empty on tag pushes.
    value: ${{ steps.meta.outputs.branch-slug }}
  image:
    description: Image name, lowercase (ghcr.io/<owner>/<repo> unless overridden).
    value: ${{ steps.meta.outputs.image }}
  registry:
    description: Registry host of `image`, for docker login.
    value: ${{ steps.meta.outputs.registry }}

runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      # Untrusted input via env, never inline. See docs/CI.md#script-injection
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        HEAD_REF: ${{ github.head_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SHA: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        IMAGE_OVERRIDE: ${{ inputs.image }}
      run: |
        set -euo pipefail

        # PRs: report head commit, not merge commit. See docs/CI.md#pr-head-commit
        if [[ -n "$HEAD_REF" ]]; then
          branch="$HEAD_REF"
          sha="$PR_HEAD_SHA"
        else
          branch=""
          [[ "$REF_TYPE" == "branch" ]] && branch="$REF_NAME"
          sha="$SHA"
        fi

        # PR head commit not in shallow merge checkout. See docs/CI.md#commit-message
        if ! message="$(git log -1 --format=%s "$sha" 2>/dev/null)"; then
          git fetch --quiet --depth=1 origin "$sha"
          message="$(git log -1 --format=%s "$sha")"
        fi

        # Tag-safe branch: feat/a.b/c -> feat-a.b-c. See docs/CI.md#image-tags
        slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[.-]+//; s/-+$//' | cut -c1-100)"

        {
          echo "branch=$branch"
          echo "branch-slug=$slug"
          image="${IMAGE_OVERRIDE:-ghcr.io/$REPOSITORY}" && image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image"
          echo "registry=${image%%/*}"
          echo "sha=$sha"
          echo "short-sha=${sha:0:7}"
          echo "commit-message=$message"
          echo "reason=$EVENT_NAME"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Build metadata"
          echo "| | |"
          echo "|---|---|"
          echo "| Branch | \`${branch:-n/a}\` |"
          echo "| Commit | \`${sha:0:7}\` $message |"
          echo "| Reason | \`$EVENT_NAME\` |"
        } >> "$GITHUB_STEP_SUMMARY"
