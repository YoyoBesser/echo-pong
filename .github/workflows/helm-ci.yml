name: Helm CI

# Path-filtered. See docs/CI.md#workflow-split
on:
  pull_request:
    branches: [main]
    paths: &paths
      - helm/**
      - .github/workflows/helm-ci.yml
      - .github/actions/**
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      sha: ${{ steps.meta.outputs.sha }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      commit-message: ${{ steps.meta.outputs.commit-message }}
      reason: ${{ steps.meta.outputs.reason }}
      branch-slug: ${{ steps.meta.outputs.branch-slug }}
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - id: meta
        uses: ./.github/actions/gather-metadata
        # Unset on GitHub; act.sh points it at a local registry. See docs/LOCAL-TESTING.md#act-wrapper
        with:
          image: ${{ vars.CI_IMAGE }}

  lint:
    needs: metadata
    runs-on: ubuntu-latest
    env:
      CHART: helm/echo-pong
      # Base values and values-local.yaml are both linted. See docs/HELM.md#local-values
      ENVS: default local
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - id: tools
        uses: ./.github/actions/install-ci-tools
        with:
          suite: helm
      - name: helm dependency build
        run: helm dependency build "$CHART"
      # Fail fast: the first failing check stops the job. See docs/CI.md#gating
      - id: helm-lint
        name: helm lint
        run: |
          set -euo pipefail
          for env in $ENVS; do
            values=() && [[ "$env" == default ]] || values=(-f "$CHART/values-$env.yaml")
            helm lint --strict "$CHART" "${values[@]}"
          done
      # Test hooks excluded from render. See docs/CI.md#chart-lint
      - id: template
        name: helm template
        # <env>-app.yaml skips the third-party subchart, for kube-linter. See docs/CI.md#kube-linter-policy
        run: |
          set -euo pipefail
          mkdir -p rendered
          for env in $ENVS; do
            values=() && [[ "$env" == default ]] || values=(-f "$CHART/values-$env.yaml")
            helm template echo-pong "$CHART" --skip-tests "${values[@]}" > "rendered/$env.yaml"
            helm template echo-pong "$CHART" --skip-tests "${values[@]}" --set envoy-gateway.enabled=false > "rendered/$env-app.yaml"
          done
      - id: kubeconform
        name: kubeconform
        env:
          K8S_VERSION: ${{ steps.tools.outputs.k8s-version }}
        # CRD schemas (Gateway API, Envoy) from the Datree catalog. See docs/CI.md#kubeconform
        run: |
          set -euo pipefail
          for env in $ENVS; do
            echo "== $env"
            kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" -cache "$KUBECONFORM_CACHE" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "rendered/$env.yaml"
          done
      - id: kube-linter
        name: kube-linter
        run: |
          set -euo pipefail
          for env in $ENVS; do
            echo "== $env"
            kube-linter lint --config helm/.kube-linter.yaml "rendered/$env-app.yaml"
          done
      # README-traced KSV IDs only; full report is informational. See docs/CI.md#trivy-config
      - id: trivy-config
        name: trivy config
        run: |
          set -euo pipefail
          gate="$(grep -oE '^KSV-[0-9]+' helm/.trivy-ksv-gate | jq -R . | jq -cs .)"
          : > gate-failures.txt
          for env in $ENVS; do
            echo "== $env"
            trivy config --quiet -f json -o "trivy-config-$env.json" "rendered/$env.yaml"
            trivy convert --format table "trivy-config-$env.json"
            jq -r --arg env "$env" --argjson gate "$gate" '.Results[]?.Misconfigurations[]?
              | select(.Status == "FAIL" and (.ID | IN($gate[])))
              | "\($env): \(.ID) \(.Message)"' "trivy-config-$env.json" >> gate-failures.txt
          done
          if [[ -s gate-failures.txt ]]; then echo "::error::README-gated KSV checks failed"; sort -u gate-failures.txt; exit 1; fi
      - if: always()
        uses: ./.github/actions/record-results
        with:
          rows: |
            tests|helm lint --strict|${{ steps.helm-lint.outcome }}|${{ steps.helm-lint.conclusion }}
            tests|helm template|${{ steps.template.outcome }}|${{ steps.template.conclusion }}
            tests|kubeconform -strict|${{ steps.kubeconform.outcome }}|${{ steps.kubeconform.conclusion }}
            tests|kube-linter (README policy)|${{ steps.kube-linter.outcome }}|${{ steps.kube-linter.conclusion }}
            security|trivy config (README KSV gate)|${{ steps.trivy-config.outcome }}|${{ steps.trivy-config.conclusion }}

  # Tests + Security tables for the whole run. See .github/workflows/AGENTS.md
  summary:
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: ./.github/actions/summarize-results
        with:
          order: lint
