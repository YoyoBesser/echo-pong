name: App CI

# Path-filtered. See docs/CI.md#workflow-split
on:
  pull_request:
    branches: [main]
    paths: &paths
      - src/**
      - helm/**
      - .github/workflows/app-ci.yml
      - .github/actions/**
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      sha: ${{ steps.meta.outputs.sha }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      commit-message: ${{ steps.meta.outputs.commit-message }}
      reason: ${{ steps.meta.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: ./.github/actions/gather-metadata

  lint:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-ci-tools
        with:
          suite: app
      # TODO: make blocking (drop continue-on-error). See docs/CI.md#soft-fail
      - name: golangci-lint
        continue-on-error: true
        working-directory: src
        run: golangci-lint run

  test:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO go test"

  secret-scan:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO secret scanning"

  # Native runner per arch, no QEMU. See docs/CI.md#build-matrix
  build:
    needs: [metadata, lint, test]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: |
          set -euo pipefail
          docker build --platform "linux/$ARCH" -t echo-pong:ci src/
          docker save echo-pong:ci | gzip > "image-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 1
      # Ship the exact binary the image runs. See docs/CI.md#binary-e2e
      - name: extract static binary
        run: |
          set -euo pipefail
          id="$(docker create echo-pong:ci)"
          mkdir -p dist && docker cp "$id:/usr/local/bin/ping-pong-app" dist/ping-pong-app && docker rm "$id"
          file dist/ping-pong-app | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: dist/ping-pong-app
          retention-days: 1

  # All e2e suites for one arch in one job, image loaded once. See docs/CI.md#e2e-tests
  e2e:
    name: e2e (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      E2E_IMAGE: echo-pong:ci
    steps:
      - uses: actions/checkout@v7
      - id: tools
        uses: ./.github/actions/install-ci-tools
        with:
          suite: minikube
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.arch }}
      - name: docker load
        run: gunzip -c "image-$ARCH.tar.gz" | docker load
      - name: CLI e2e
        working-directory: src
        run: go test -tags e2e -count=1 -v -run '^TestCLI$' ./test/e2e
      - name: API e2e
        working-directory: src
        run: go test -tags e2e -count=1 -v -run '^TestAPI$' ./test/e2e
      - name: minikube e2e
        env:
          K8S_VERSION: ${{ steps.tools.outputs.k8s-version }}
        run: src/test/e2e/minikube-e2e.sh

  # Static binary on stock distros, same CLI + API suites. See docs/CI.md#binary-e2e
  binary-e2e:
    name: binary-e2e (${{ matrix.arch }}, ${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        os: [ubuntu, alpine]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      OS: ${{ matrix.os }}
      E2E_IMAGE: echo-pong:bin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-ci-tools
        with:
          suite: app
      - uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.arch }}
          path: dist
      - name: docker build ${{ matrix.os }} wrapper
        # Artifacts drop the exec bit.
        run: |
          chmod +x dist/ping-pong-app
          docker build -f src/test/e2e/binary.Dockerfile --build-arg "BASE=$OS:latest" -t "$E2E_IMAGE" dist/
      - name: CLI + API e2e
        working-directory: src
        run: go test -tags e2e -count=1 -v ./test/e2e

  scan:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO vulnerability scan; fail on critical/high"
