name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version to deploy (e.g. v1.2.3)
        required: true

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      reason: ${{ steps.meta.outputs.reason }}
      branch-slug: ${{ steps.meta.outputs.branch-slug }}
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - id: meta
        uses: ./.github/actions/gather-metadata
        # Unset on GitHub; act.sh points it at a local registry. See docs/LOCAL-TESTING.md#act-wrapper
        with:
          image: ${{ vars.CI_IMAGE }}

  deploy:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ inputs.version }}
        run: echo "TODO helm upgrade --install --atomic with image tag $VERSION"

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO verify rollout + /health, /ping"

  cleanup:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO prune old/untagged images per retention policy"

  # Tests + Security tables for the whole run. See .github/workflows/AGENTS.md
  summary:
    needs: [metadata, deploy, verify, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: ./.github/actions/summarize-results
        with:
          order: metadata deploy verify cleanup
