name: Scan image

# Reusable: CI and release scan the same way, both blocking. See docs/CI.md#reusable-scans
on:
  workflow_call:
    inputs:
      image:
        description: Image ref to scan (tag or digest), already pushed.
        type: string
        required: true
      registry:
        description: Registry host of the image, for docker login.
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  scan-image:
    name: scan-image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.image }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: docker/login-action@v4  # latest: https://github.com/docker/login-action/releases (checked 2026-10-21)
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: ./.github/actions/install-ci-tools
        with:
          suite: scan
      # Fail on CRITICAL/HIGH, fixable or not (README L51). See docs/CI.md#image-scan
      - id: trivy
        name: trivy image (vuln + misconfig)
        run: .github/scripts/trivy-image.sh "$IMAGE" "$ARCH"
      - if: always()
        uses: ./.github/actions/record-results
        with:
          scope: ${{ matrix.arch }}
          rows: |
            security|trivy image (vuln + misconfig)|${{ steps.trivy.outcome }}|${{ steps.trivy.conclusion }}
