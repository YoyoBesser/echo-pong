name: Scan source

# Reusable: SAST + SCA on src/, shared by CI and release. See docs/CI.md#reusable-scans
on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: ./.github/actions/install-ci-tools
        with:
          suite: app
      - id: gosec
        name: gosec (SAST)
        working-directory: src
        # gosec via golangci-lint: standalone v2.29.0 can't load go1.27 packages. See docs/CI.md#sast-and-sca
        run: golangci-lint run --enable-only gosec ./...
      - id: govulncheck
        name: govulncheck (SCA)
        working-directory: src
        run: govulncheck -tags e2e ./...
      - if: always()
        uses: ./.github/actions/record-results
        with:
          rows: |
            security|gosec (SAST)|${{ steps.gosec.outcome }}|${{ steps.gosec.conclusion }}
            security|govulncheck (SCA)|${{ steps.govulncheck.outcome }}|${{ steps.govulncheck.conclusion }}
