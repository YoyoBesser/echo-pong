name: Release

# vX.Y.Z tag: build, gate on scans, then tag image + chart + binaries. See docs/RELEASE.md#pipeline
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      commit-message: ${{ steps.meta.outputs.commit-message }}
      reason: ${{ steps.meta.outputs.reason }}
      branch-slug: ${{ steps.meta.outputs.branch-slug }}
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - id: meta
        uses: ./.github/actions/gather-metadata
        # Unset on GitHub; act.sh points it at a local registry. See docs/LOCAL-TESTING.md#act-wrapper
        with:
          image: ${{ vars.CI_IMAGE }}

  # Pushed by digest only: nothing is tagged until the scans pass. See docs/RELEASE.md#pipeline
  image:
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: docker/login-action@v4  # latest: https://github.com/docker/login-action/releases (checked 2026-10-21)
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4  # latest: https://github.com/docker/setup-buildx-action/releases (checked 2026-10-21)
        # Under act, builder must reach act.sh's localhost registry. See docs/LOCAL-TESTING.md#act-wrapper
        with:
          driver-opts: ${{ env.ACT && 'network=host' || '' }}
      - id: build
        name: docker buildx build + push by digest (amd64, arm64)
        uses: docker/build-push-action@v7  # latest: https://github.com/docker/build-push-action/releases (checked 2026-10-21)
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=registry,ref=${{ env.IMAGE }}:main-cache

  # Release gate: same scans as CI, all blocking. See docs/CI.md#reusable-scans
  scan-source:
    needs: metadata
    uses: ./.github/workflows/scan-source.yml

  scan-repo:
    needs: metadata
    uses: ./.github/workflows/scan-repo.yml

  scan-image:
    needs: [metadata, image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/scan-image.yml
    with:
      image: ${{ needs.metadata.outputs.image }}@${{ needs.image.outputs.digest }}
      registry: ${{ needs.metadata.outputs.registry }}

  # Only after every scan passed: tag the scanned digest, push the chart. See docs/RELEASE.md#pipeline
  publish:
    needs: [metadata, image, scan-source, scan-repo, scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
      REGISTRY: ${{ needs.metadata.outputs.registry }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: docker/login-action@v4  # latest: https://github.com/docker/login-action/releases (checked 2026-10-21)
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/install-ci-tools
        with:
          suite: release
      - name: tag image ${{ github.ref_name }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: helm package + push (OCI)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-chart.sh "$TAG" "$IMAGE" "$REGISTRY"

  binaries:
    needs: [metadata, image, scan-source, scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}@${{ needs.image.outputs.digest }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: docker/login-action@v4  # latest: https://github.com/docker/login-action/releases (checked 2026-10-21)
        with:
          registry: ${{ needs.metadata.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/install-ci-tools
        with:
          suite: release
      # linux from the scanned image, darwin cross-compiled. See docs/RELEASE.md#binaries
      - id: binaries
        name: build release binaries
        run: .github/scripts/release-binaries.sh "$TAG" "$IMAGE" dist
      - uses: actions/upload-artifact@v7  # latest: https://github.com/actions/upload-artifact/releases (checked 2026-10-21)
        # act has no working artifact server. See docs/LOCAL-TESTING.md#act-wrapper
        continue-on-error: ${{ !!env.ACT }}
        with:
          name: release-binaries
          path: dist/
          retention-days: 7
      - if: always()
        uses: ./.github/actions/record-results
        with:
          rows: |
            tests|release binaries|${{ steps.binaries.outcome }}|${{ steps.binaries.conclusion }}

  github-release:
    needs: [metadata, image, publish, binaries]
    if: ${{ !github.event.act }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      IMAGE: ${{ needs.metadata.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8  # latest: https://github.com/actions/download-artifact/releases (checked 2026-10-21)
        with:
          name: release-binaries
          path: dist
      - name: gh release create
        run: |
          {
            echo "Image: \`$IMAGE:$TAG\` (\`$DIGEST\`, linux/amd64 + linux/arm64)"
            echo
            echo "Chart: \`helm install echo-pong oci://${IMAGE%/*}/charts/echo-pong --version ${TAG#v}\`"
          } > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --generate-notes --verify-tag

  # Tests + Security tables for the whole run. See .github/workflows/AGENTS.md
  summary:
    needs: [image, scan-source, scan-repo, scan-image, publish, binaries, github-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: ./.github/actions/summarize-results
        with:
          order: scan-source scan-repo scan-image binaries
