name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short-sha: ${{ steps.meta.outputs.short-sha }}
      commit-message: ${{ steps.meta.outputs.commit-message }}
      reason: ${{ steps.meta.outputs.reason }}
      branch-slug: ${{ steps.meta.outputs.branch-slug }}
      image: ${{ steps.meta.outputs.image }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - id: meta
        uses: ./.github/actions/gather-metadata
        # Unset on GitHub; act.sh points it at a local registry. See docs/LOCAL-TESTING.md#act-wrapper
        with:
          image: ${{ vars.CI_IMAGE }}

  image:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO build + push multi-arch image to GHCR under the commit SHA (${{ needs.metadata.outputs.short-sha }})"

  # Release gate: same scans as CI, blocking. Nothing is tagged vX.Y.Z unless both pass. See docs/CI.md#reusable-scans
  scan-source:
    needs: metadata
    uses: ./.github/workflows/scan-source.yml
    with:
      blocking: true

  scan-image:
    needs: [metadata, image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/scan-image.yml
    with:
      image: ${{ needs.metadata.outputs.image }}:${{ needs.metadata.outputs.sha }}
      registry: ${{ needs.metadata.outputs.registry }}
      blocking: true

  publish:
    needs: [metadata, scan-source, scan-image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO retag ${{ needs.metadata.outputs.short-sha }} as ${{ github.ref_name }}, sign image + attach SBOM"
      - run: echo "TODO package + push Helm chart to GHCR (OCI)"

  binaries:
    needs: [metadata, scan-source]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO cross-compile linux/darwin x amd64/arm64"

  github-release:
    needs: [metadata, publish, binaries]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO publish GitHub Release ${{ github.ref_name }} with binaries"

  # Tests + Security tables for the whole run. See .github/workflows/AGENTS.md
  summary:
    needs: [metadata, image, scan-source, scan-image, publish, binaries, github-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # latest: https://github.com/actions/checkout/releases (checked 2026-10-21)
      - uses: ./.github/actions/summarize-results
        with:
          order: scan-source scan-image
